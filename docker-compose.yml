services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: payments_dashboard
      POSTGRES_PASSWORD: payments_dashboard
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432" # 5432 is often already taken by a local Postgres install
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payments_dashboard"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: >
      bash -c "rm -f tmp/pids/server.pid &&
               bin/rails db:prepare &&
               bin/rails db:seed &&
               bin/rails server -b 0.0.0.0"
    volumes:
      - .:/rails
      - bundle_data:/usr/local/bundle
    ports:
      - "3000:3000"
    environment:
      RAILS_ENV: development
      DATABASE_URL: postgres://payments_dashboard:payments_dashboard@db:5432/payments_dashboard_development
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  bundle_data:
